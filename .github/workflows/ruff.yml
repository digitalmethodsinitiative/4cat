# This will verify if the code committed has been formatted in accordance with what Ruff would do

name: Test conformance to Ruff code formatter

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "master" branch
  push
jobs:
  check_ruff_conforming:
    name: Test conformance to Ruff code formatter
    runs-on: ubuntu-latest
    steps:
      - name: checkout-repo
        uses: actions/checkout@v4
      - name: ruff-action
        # Pinned so that a new ruff release cannot change what this check does
        # until someone decides it should. Which rules are checked is set in
        # ruff.toml.
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.1"
