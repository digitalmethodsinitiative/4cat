# This will publish an image to Docker Hub on a new release

name: Publish new release to Docker Hub

# Controls when the workflow will run
on:
  release:
    types: [published]
  # A workflow can only be started by hand if it offers workflow_dispatch on the
  # default branch -- once it does, a run can be pointed at any branch. This is here
  # so that changes to this workflow can be tried out on a branch before they are
  # merged, and the inputs below are the ones those branches expect. Nothing on this
  # branch acts on them yet.
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish the catalogue as this release tag (e.g. v1.56). Leave empty to build a development snapshot of this commit, which must not replace the public catalogue.'
        type: string
        default: ''
      open_pull_request:
        description: 'Open a pull request against 4cat-site. Off by default for manual runs; the bundle is always attached to the run as an artifact.'
        type: boolean
        default: false

jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub
    # Only an actual release publishes an image. A run started by hand is for trying
    # out a branch's version of this workflow, and must never push an image or move
    # the `stable` tag that installations pull.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_DALE_LOGIN }}
          password: ${{ secrets.DOCKER_DALE_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: digitalmethodsinitiative/4cat

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Update the stable tag image
      - name: Build and push stable Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: digitalmethodsinitiative/4cat:stable
