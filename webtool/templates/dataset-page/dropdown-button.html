<div class="action-button-wrap">
    {% if dataset.get_results_path().exists() %}
    {% set have_dropdown = (dataset.get_own_processor().map_item or dataset.annotation_fields) %}
    <ul class="dataset-fetch{% if have_dropdown %} with-dropdown{% endif %}">
        <li>
            <a class="button-like" href="{{ url_for('dataset.get_result', dataset_key=dataset.key) }}">Download ({{
                dataset.get_extension() }}, {{ dataset.get_results_path()|filesize }})</a>
            {% if have_dropdown %}
            <ul class="dropdown-action-button">
                <li><a href="{{ url_for('dataset.get_mapped_result', key=dataset.key) }}">Download (csv)</a></li>
            </ul>
            {% endif %}
        </li>
    </ul>
    {% endif %}
</div>
